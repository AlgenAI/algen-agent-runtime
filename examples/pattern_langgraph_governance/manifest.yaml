id: pattern_langgraph_governance
display_name: "LangGraph Governance Adapter"
tier: pattern
status: runnable
description: >
  Graph application wrapped by Runtime's LangGraph adapter with normalized identity and output.

extras:
  - name: langgraph
    description: LangGraph and LangChain dependencies
    install: "pip install langgraph langchain"

external_services: []
secrets: []

entry_points:
  cli: examples.pattern_langgraph_governance.app

commands:
  setup: "pip install -e '.[dev]' && pip install langgraph langchain"
  run: "python -m examples.pattern_langgraph_governance.app"
  test: "python -m pytest tests/unit/test_example_workflows.py -q"
  reset: "echo 'No persistent state to reset.'"

expected_duration_seconds: 30
deterministic_mock_support: true
