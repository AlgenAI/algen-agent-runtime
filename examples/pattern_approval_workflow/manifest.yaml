id: pattern_approval_workflow
display_name: "Approval-Gated Workflow"
tier: pattern
status: runnable
description: >
  Demonstrates a first-class approval node and idempotent synthetic CRM update.

extras: []
external_services: []

secrets: []

entry_points:
  cli: examples.pattern_approval_workflow.app

commands:
  setup: "pip install -e '.[dev]'"
  run: "python -m examples.pattern_approval_workflow.app"
  test: "python -m pytest tests/unit/test_example_workflows.py -q"
  reset: "echo 'No persistent state to reset.'"

expected_duration_seconds: 60
deterministic_mock_support: true
