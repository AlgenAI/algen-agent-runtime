providers:
  mock: {type: mock, default_model: deterministic}
retrieval:
  synthetic-corpus:
    type: memory
    documents:
      - {id: runtime, source: "synthetic://runtime", text: "Runtime owns workflow scheduling and lifecycle."}
      - {id: application, source: "synthetic://application", text: "Applications own domain behavior."}

agents:
  - name: pattern-governed-research
    version: 1.0.0
    description: Evidence-oriented research agent with citation verification
    capabilities: [research, citations]
    system_instructions: Synthesize supplied evidence, cite its source identifiers, and separate fact from inference.
    default_model: {name: deterministic, provider: mock, model: deterministic}
    planning_strategy: direct
    guardrail_policy: {policies: [secrets, authorization, side_effects], require_citations: true}
    max_steps: 12

workflows:
  governed-research:
    name: governed-research
    version: 1.0.0
    description: Bounded evidence collection, cited synthesis, and deterministic citation verification
    hook_provider: examples.pattern_governed_research.hooks:create_hooks
    nodes:
      - id: collect
        kind: handler
        handler: research.collect
        output_key: evidence
        resources:
          - {kind: retrieval, name: synthetic-corpus, access: read, description: Allowlisted local evidence}
      - id: synthesize
        kind: agent
        depends_on: [collect]
        agent: pattern-governed-research
        input_builder: research.synthesize
        output_schema_hook: research.answer_schema
        output_key: answer
      - id: verify
        kind: handler
        depends_on: [synthesize]
        handler: research.verify
        output_key: verified_answer
        resources:
          - {kind: telemetry, name: citation-audit, access: observe, description: Citation verification evidence}
storage:
  run_store: memory
  memory_store: memory
  event_store: memory
  audit_store: memory
  approval_store: memory
  artifact_store: memory
  tool_execution_store: memory
  conversation_store: memory
telemetry: {enabled: false}
