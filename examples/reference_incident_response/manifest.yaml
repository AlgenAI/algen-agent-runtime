id: reference_incident_response
display_name: "IT Incident Triage and Remediation"
tier: reference
status: placeholder
description: >
  Multi-agent incident response: alert classification, evidence collection, analysis,
  remediation planning, and human-approved execution using a synthetic infrastructure API only.

extras: []
external_services: []
secrets:
  - name: OPENAI_API_KEY
    description: Generation provider
    required: true

entry_points:
  cli: examples.reference_incident_response.app

commands:
  setup: "pip install -e '.[dev]'"
  run: "python -m examples.reference_incident_response.app"
  test: "python -m pytest examples/reference_incident_response/tests/ -q"
  reset: "echo 'See README.md for reset instructions once implemented.'"

expected_duration_seconds: 180
deterministic_mock_support: false
