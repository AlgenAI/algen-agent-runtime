id: quickstart_tool
display_name: "Tool Quickstart"
tier: quickstart
status: runnable
description: >
  Introduces one typed read-only capability as a Runtime workflow resource.

extras: []
external_services: []
secrets: []

entry_points:
  cli: examples.quickstart_tool.app

commands:
  setup: "pip install -e '.[dev]'"
  run: "python -m examples.quickstart_tool.app"
  test: "python -m pytest tests/unit/test_example_workflows.py -q"
  reset: "echo 'No persistent state to reset.'"

expected_duration_seconds: 10
deterministic_mock_support: true
