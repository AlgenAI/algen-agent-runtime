providers:
  mock: {type: mock, default_model: deterministic}
agents:
  - name: inventory-presenter
    version: 1.0.0
    description: Presents a result returned by a bounded read-only inventory capability
    system_instructions: Return only the supplied inventory result without inventing fields.
    default_model: {name: deterministic, provider: mock, model: deterministic}
    planning_strategy: direct
    max_steps: 3
workflows:
  tool-quickstart:
    name: tool-quickstart
    version: 1.0.0
    description: Read a typed synthetic inventory capability and present its result
    hook_provider: examples.quickstart_tool.hooks:create_hooks
    nodes:
      - id: lookup
        kind: handler
        handler: inventory.lookup
        output_key: inventory
        resources:
          - {kind: tool, name: inventory.lookup, access: invoke, description: Typed read-only inventory lookup}
      - id: present
        kind: agent
        depends_on: [lookup]
        agent: inventory-presenter
        input_builder: inventory.present
        output_schema_hook: inventory.result_schema
        output_key: answer
    metadata: {pattern: typed-read-tool, studio_importable: "true"}
storage:
  run_store: memory
  memory_store: memory
  event_store: memory
  audit_store: memory
  approval_store: memory
  artifact_store: memory
  tool_execution_store: memory
  conversation_store: memory
telemetry: {enabled: false}

