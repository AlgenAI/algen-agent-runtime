id: pattern_multi_agent_fanout
display_name: "Multi-Agent Fan-Out"
tier: pattern
status: runnable
description: >
  Planner, bounded dynamic agent fan-out, join, and synthesis using the Runtime DAG executor.

extras: []
external_services: []
secrets: []

entry_points:
  cli: examples.pattern_multi_agent_fanout.app

commands:
  setup: "pip install -e '.[dev]'"
  run: "python -m examples.pattern_multi_agent_fanout.app"
  test: "python -m pytest tests/unit/test_example_workflows.py -q"
  reset: "echo 'No persistent state to reset.'"

expected_duration_seconds: 30
deterministic_mock_support: true
