[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "algen-agent-runtime"
dynamic = ["version"]
description = "Algen's provider-neutral runtime for governed AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "AlgenAI"}]
maintainers = [{name = "AlgenAI"}]
keywords = [
  "agents",
  "agent-runtime",
  "ai-governance",
  "llm",
  "model-routing",
  "rag",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0,<7",
  "structlog>=24.4,<26",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
object-storage = ["asyncpg>=0.29,<1", "boto3>=1.43,<2"]
pgvector = ["asyncpg>=0.29,<1", "pgvector>=0.3,<1"]
talk-to-data = ["asyncpg>=0.29,<1", "pgvector>=0.3,<1", "traccia>=0.1.28,<0.2"]
hiring = ["asyncpg>=0.29,<1", "pgvector>=0.3,<1", "PyMuPDF>=1.24,<2", "python-multipart>=0.0.9,<1", "traccia>=0.1.28,<0.2"]
redis = ["redis>=5,<9"]
auth = ["PyJWT[crypto]>=2.9,<3"]
transformers = ["transformers>=4.44,<6", "torch>=2.4,<3"]
traccia = ["traccia>=0.1.28,<0.2"]
chroma = ["chromadb>=1.0,<2"]
faiss = ["faiss-cpu>=1.9,<2", "numpy>=2,<3"]
qdrant = ["qdrant-client>=1.12,<2"]
langgraph = ["langgraph>=1,<2"]
openai-agents = ["openai-agents>=0.6,<1"]
autogen = ["autogen-agentchat>=0.7,<1"]
crewai = ["crewai>=1,<2"]
frameworks = [
  "langgraph>=1,<2",
  "openai-agents>=0.6,<1",
  "autogen-agentchat>=0.7,<1",
  "crewai>=1,<2",
]
vector-stores = [
  "asyncpg>=0.29,<1",
  "pgvector>=0.3,<1",
  "chromadb>=1.0,<2",
  "faiss-cpu>=1.9,<2",
  "numpy>=2,<3",
  "qdrant-client>=1.12,<2",
]
dev = [
  "mypy>=1.11,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
[project.scripts]
algen-agent-runtime = "algen_agent_runtime.api.app:main"

[project.urls]
Homepage = "https://github.com/AlgenAI/algen-agent-runtime"
Source = "https://github.com/AlgenAI/algen-agent-runtime"
Documentation = "https://github.com/AlgenAI/algen-agent-runtime#readme"
Issues = "https://github.com/AlgenAI/algen-agent-runtime/issues"
Changelog = "https://github.com/AlgenAI/algen-agent-runtime/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/algen_agent_runtime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/algen_agent_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "examples"

[tool.hatch.build.targets.sdist]
include = [
  "/.agents/skills",
  "/src/algen_agent_runtime",
  "/examples",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: tests requiring external credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["algen_agent_runtime"]

[[tool.mypy.overrides]]
module = ["jsonschema", "yaml", "transformers", "opentelemetry.exporter.*", "asyncpg", "redis", "redis.*", "pgvector", "pgvector.*", "chromadb", "faiss", "numpy", "qdrant_client", "qdrant_client.*", "agents", "jwt", "fitz", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true
