# Prometheus: scrapes the collector and loads the Runtime's shipped alert rules
# (deploy/observability/prometheus/alerts.yml, mounted at /etc/prometheus/rules/).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/alerts.yml
scrape_configs:
  - job_name: otel-collector
    # Keep the `job` label the collector sets from service.name, not this scrape job's name.
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]
