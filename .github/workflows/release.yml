name: Release

# Started by auto-release.yml (gh workflow run) after it creates the tag and the GitHub release, or
# by a maintainer for an existing tag. Hardening against a poisoned build (the 2026 LiteLLM
# compromise came through an unpinned CI action that read the PyPI token):
# - PyPI trusted publishing (OIDC): there is no PyPI token to steal; the `pypi` environment
#   requires a maintainer's approval and accepts deployments from `main` only.
# - Every action is pinned to a full commit SHA; nothing is cached between runs.
# - Tests run in their own job. The artifacts are built in a separate job that installs only the
#   hash-locked requirements/build.txt and runs nothing else.
# - The publish job attests the exact files it uploads (GitHub provenance, and PEP 740 on PyPI);
#   the GitHub release carries SHA256SUMS, the CycloneDX SBOM and the license report.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0b4). The tag must already exist."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import pathlib, re; text = pathlib.Path("src/algen_agent_runtime/__init__.py").read_text(); print(re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE).group(1))')
          test "v${version}" = "${TAG}"
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff format --check src tests algen_agent_runtime_examples
      - run: ruff check src tests algen_agent_runtime_examples
      - run: mypy src/algen_agent_runtime
      - run: pytest -q -p no:cacheprovider

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements/build.txt
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Generate and verify artifact checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Inspect release artifacts
        run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - run: cd dist && sha256sum -c SHA256SUMS
      - name: Install wheel and verify CLI and scaffolding outside checkout
        run: scripts/smoke-install.sh dist python

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      # What a deployment of this release installs: the wheel and the locked service dependencies.
      - name: CycloneDX SBOM and license report
        run: |
          python -m venv "$RUNNER_TEMP/sbom-env"
          "$RUNNER_TEMP/sbom-env/bin/pip" install --require-hashes --no-deps -r requirements/service.txt
          "$RUNNER_TEMP/sbom-env/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/sbom-env/bin/python" scripts/sbom.py sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, smoke, sbom]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - run: cd dist && sha256sum -c SHA256SUMS && rm SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Attach checksums, SBOM and license report to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/SHA256SUMS sbom/sbom.cdx.json sbom/licenses.md --repo "$REPO" --clobber
