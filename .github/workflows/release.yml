name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0a1). The tag must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On workflow_dispatch use the provided tag; on release event use the release ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches package version
        run: |
          version=$(python -c 'import pathlib, re; text = pathlib.Path("src/algen_agent_runtime/__init__.py").read_text(); print(re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE).group(1))')
          ref_name="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "v${version}" = "${ref_name}"
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests examples
      - run: ruff check src tests examples
      - run: mypy src/algen_agent_runtime
      - run: pytest -q -p no:cacheprovider
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Generate and verify artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          dist = Path("dist")
          sums = []
          for p in sorted(dist.iterdir()):
              if p.suffix in (".whl", ".gz"):
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  sums.append(f"{digest}  {p.name}\n")
          Path("dist/SHA256SUMS").write_text("".join(sums))
          PY
          cd dist
          sha256sum -c SHA256SUMS
      - name: Inspect release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "algen_agent_runtime/py.typed",
                  "algen_agent_runtime/persistence/migrations/001_initial.sql",
                  "algen_agent_runtime/tools/starter/__init__.py",
                  "algen_agent_runtime/mcp/__init__.py",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel missing required files: {sorted(missing)}")
              if any("studio" in name.lower() for name in names):
                  raise SystemExit("Runtime artifact unexpectedly contains Studio files")
              if any("__pycache__" in name or name.endswith(".pyc") for name in names):
                  raise SystemExit("wheel contains Python cache files")
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              for required in ("LICENSE", "NOTICE", "README.md"):
                  if not any(name.endswith(f"/{required}") for name in names):
                      raise SystemExit(f"sdist missing {required}")
          PY
      - name: Install wheel and verify CLI and scaffolding outside checkout
        run: |
          python -m venv /tmp/algen-release-smoke
          /tmp/algen-release-smoke/bin/pip install --upgrade pip
          /tmp/algen-release-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/algen-release-smoke/bin/python -c "import algen_agent_runtime; print(algen_agent_runtime.__version__)"
          test -x /tmp/algen-release-smoke/bin/algen-agent-runtime
          /tmp/algen-release-smoke/bin/algen-agent-runtime --help
          /tmp/algen-release-smoke/bin/algen-agent-runtime serve --help
          /tmp/algen-release-smoke/bin/python -c "from algen_agent_runtime.api.app import create_app; assert create_app().title == 'Algen Agent Runtime'"
          /tmp/algen-release-smoke/bin/python -c "from algen_agent_runtime.tools.starter import get_starter_tools; assert len([t.definition.name for t in get_starter_tools()]) >= 5"
          rm -rf /tmp/smoke-scaffold-release
          mkdir -p /tmp/smoke-scaffold-release
          cd /tmp/smoke-scaffold-release
          /tmp/algen-release-smoke/bin/algen-agent-runtime new smoke_agent --template agent
          cd smoke_agent
          /tmp/algen-release-smoke/bin/pip install pytest pytest-asyncio
          /tmp/algen-release-smoke/bin/pytest test_agent.py
          /tmp/algen-release-smoke/bin/python app.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Remove non-distribution assets before PyPI publish
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

