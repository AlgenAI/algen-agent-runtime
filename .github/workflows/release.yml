name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0a1). The tag must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_dispatch use the provided tag; on release event use the release ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches package version
        run: |
          version=$(python -c 'import pathlib, re; text = pathlib.Path("src/algen_agent_runtime/__init__.py").read_text(); print(re.search(r"^__version__ = \"([^\"]+)\"$", text, re.MULTILINE).group(1))')
          ref_name="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "v${version}" = "${ref_name}"
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests algen_agent_runtime_examples
      - run: ruff check src tests algen_agent_runtime_examples
      - run: mypy src/algen_agent_runtime
      - run: pytest -q -p no:cacheprovider
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Generate and verify artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          dist = Path("dist")
          sums = []
          for p in sorted(dist.iterdir()):
              if p.suffix in (".whl", ".gz"):
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  sums.append(f"{digest}  {p.name}\n")
          Path("dist/SHA256SUMS").write_text("".join(sums))
          PY
          cd dist
          sha256sum -c SHA256SUMS
      - name: Inspect release artifacts
        run: python scripts/check_dist.py dist
      - name: Install wheel and verify CLI and scaffolding outside checkout
        run: scripts/smoke-install.sh dist python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Remove non-distribution assets before PyPI publish
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

