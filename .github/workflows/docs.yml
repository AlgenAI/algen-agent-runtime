name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/docs.html"
      - "docs/assets/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/docs.html"
      - "docs/assets/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docs/docs.html is the site's single page. Its links to the Markdown guides are relative so
      # they work in a checkout; on the site they point at the rendered files on GitHub.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/assets _site/assets
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/main"
          sed -E \
            -e "s#href=\"\.\./([A-Za-z0-9_.-]+\.md)#href=\"${blob}/\1#g" \
            -e "s#href=\"([A-Za-z0-9_-]+\.md)#href=\"${blob}/docs/\1#g" \
            docs/docs.html > _site/index.html
          touch _site/.nojekyll
          if grep -nE 'href="[^":#]+\.md' _site/index.html; then
            echo "::error::relative Markdown links remain in the site"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
