name: Auto Release

# Triggered on every push to main.
# Reads __version__ from src/algen_agent_runtime/__init__.py.
# If the corresponding tag already exists the job exits cleanly (idempotent).
# Otherwise it extracts the matching section from CHANGELOG.md, creates the tag and GitHub Release,
# and starts release.yml for that tag (build, attest, publish to PyPI after a maintainer approves).
#
# It uses the workflow's own GITHUB_TOKEN. Events that token creates do not start other workflows,
# except workflow_dispatch, so release.yml is started explicitly with `gh workflow run` and no
# personal access token is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Create the release and start release.yml even if the tag already exists"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  auto-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and the release
      actions: write    # start release.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ── 1. Read the package version ────────────────────────────────────────
      - name: Read version
        id: version
        run: |
          version=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/algen_agent_runtime/__init__.py").read_text()
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("__version__ not found in __init__.py")
          print(match.group(1))
          PY
          )
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::unexpected version: $version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

      # ── 2. Skip if the tag already exists (idempotent) ───────────────────
      - name: Check if tag already exists
        id: tag_check
        env:
          FORCE: ${{ inputs.force || 'false' }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "exists=forced" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG exists; force set, release.yml will be started again."
            else
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG already exists — skipping release."
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist — will create release."
          fi

      # ── 3. Extract changelog section for this version ────────────────────
      - name: Extract changelog
        if: steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" > "$RUNNER_TEMP/algen-release-notes.md" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          # Match the section for this exact version: ## [0.2.0b4] or ## [0.2.0b4] - date
          pattern = rf"^##\s+\[{re.escape(version)}\].*?\n(.*?)(?=\n##\s+\[|\Z)"
          match = re.search(pattern, text, re.DOTALL | re.MULTILINE)
          print(match.group(1).strip() if match else f"Release {version}.")
          PY

      # ── 4. Create tag and GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease_flag=""
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" \
            --title "algen-agent-runtime ${TAG}" \
            --notes-file "$RUNNER_TEMP/algen-release-notes.md" \
            $prerelease_flag \
            --target "$GITHUB_SHA"

      # ── 5. Build, attest and publish ──────────────────────────────────────
      - name: Start release.yml
        if: steps.tag_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh workflow run release.yml --repo "$REPO" --ref main -f tag="$TAG"
