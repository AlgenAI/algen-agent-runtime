name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Actions are pinned to full commit SHAs (Dependabot updates them). The base jobs install the
# hash-locked requirements/ci.txt; scripts/lock-requirements.sh regenerates it.
jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff format --check src tests algen_agent_runtime_examples
      - run: ruff check src tests algen_agent_runtime_examples
      - run: mypy src/algen_agent_runtime
      - run: pytest -q -p no:cacheprovider

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: >-
          pytest -q -p no:cacheprovider
          --cov=algen_agent_runtime
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=75
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The same hash-locked build tools as the release; no build isolation, which would fetch
      # unpinned ones.
      - run: python -m pip install --require-hashes --no-deps -r requirements/build.txt
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - name: Generate and verify artifact checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Inspect artifact contents
        run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  clean-install:
    name: Clean install (Python ${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
      - name: Install wheel and verify CLI and scaffolding outside checkout
        run: scripts/smoke-install.sh dist python

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build, start, readiness, one run on the mock provider, graceful drain on SIGTERM.
      - run: scripts/container-smoke.sh

  container-integration:
    name: Container Integration (PostgreSQL & Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: algen_test
          POSTGRES_USER: algen
          POSTGRES_PASSWORD: algen_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -e '.[postgres,redis]'
      - name: Run Postgres and Redis integration tests
        env:
          POSTGRES_DSN: postgresql://algen:algen_password@localhost:5432/algen_test
          REDIS_URL: redis://localhost:6379/0
        # The persistence drills run in their own job, on containers they can pause and restart.
        run: pytest -q -p no:cacheprovider -m "(integration or postgres or redis) and not drill"

  persistence-drills:
    name: Persistence drills (PostgreSQL & Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade and rollback drills run the previous release from its tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      - run: python -m pip install --no-build-isolation -e '.[postgres,redis]'
      - name: Run the drills against throwaway PostgreSQL 17 and Redis 7 containers
        env:
          PYTHON: python
        # Restart, crash, concurrent approval, outage, failover, backup/restore, upgrade and
        # rollback; the soak drill stays off (ALGEN_DRILL_SOAK_RUNS unset).
        run: scripts/integration-tests.sh tests/drills -m drill -o faulthandler_timeout=300

  optional-integration:
    name: Optional Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt -r requirements/build.txt
      # The optional frameworks stay unlocked on purpose: this job catches their new releases.
      - run: python -m pip install --no-build-isolation -e '.[encryption,frameworks,mcp,traccia]'
      - name: Run optional framework and integration tests
        run: >-
          pytest -q -p no:cacheprovider
          tests/unit/test_framework_adapters.py
          tests/unit/test_framework_adapters_contracts.py
          tests/contract/test_framework_sdk_surfaces.py
          tests/unit/test_mcp_client.py
