name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests examples
      - run: ruff check src tests examples
      - run: mypy src/algen_agent_runtime
      - run: pytest -q -p no:cacheprovider

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          pytest -q -p no:cacheprovider
          --cov=algen_agent_runtime
          --cov-report=term
          --cov-report=xml
          --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect artifact contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "algen_agent_runtime/py.typed",
                  "algen_agent_runtime/persistence/migrations/001_initial.sql",
              }
              missing = required - names
              if missing:
                  raise SystemExit(f"wheel missing required files: {sorted(missing)}")
              if any("__pycache__" in name or name.endswith(".pyc") for name in names):
                  raise SystemExit("wheel contains Python cache files")
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              if not any(name.endswith("/LICENSE") for name in names):
                  raise SystemExit("sdist missing LICENSE")
          PY
      - name: Install wheel outside the checkout
        run: |
          python -m venv /tmp/algen-wheel-smoke
          /tmp/algen-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/algen-wheel-smoke/bin/python -c "import algen_agent_runtime; print(algen_agent_runtime.__version__)"
          test -x /tmp/algen-wheel-smoke/bin/algen-agent-runtime
          /tmp/algen-wheel-smoke/bin/python -c "from algen_agent_runtime.api.app import create_app; assert create_app().title == 'Algen Agent Runtime'"
          /tmp/algen-wheel-smoke/bin/python -c "from importlib.resources import files; assert files('algen_agent_runtime').joinpath('persistence/migrations/001_initial.sql').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
