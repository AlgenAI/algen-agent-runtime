name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# Third-party scanners are installed as pinned, checksum-verified binaries rather than as actions:
# a moved action tag (the aquasecurity/trivy-action compromise behind the 2026 LiteLLM incident)
# then cannot change what runs. Change a version together with its SHA-256 from the release's
# checksums file, and prefer releases at least two weeks old.
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python, actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements/security.txt
      # Audit what deployments and CI install: the locked service image and test dependencies.
      - run: python -m pip_audit --require-hashes --disable-pip -r requirements/service.txt
      - run: python -m pip_audit --require-hashes --disable-pip -r requirements/ci.txt
      # Fail the release gate on high-severity findings. Medium and low findings
      # remain visible in the job log and are triaged before a public release.
      - run: bandit -q -lll -r src/algen_agent_runtime

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # zizmor over .github/: SHA pins, script injection, credentials, permissions, triggers and
      # Dependabot cooldowns. The token enables its online audits (impostor commits, known
      # vulnerable actions); it is read-only here.
      - run: scripts/check-workflows.sh
        env:
          GH_TOKEN: ${{ github.token }}

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the v8.30.1 release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and run Gitleaks CLI
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --verbose --redact

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the image scan to code scanning, so an image CVE is an alert that closes once fixed.
      security-events: write
    env:
      TRIVY_VERSION: "0.76.1"
      # SHA-256 of trivy_0.76.1_Linux-64bit.tar.gz from the v0.76.1 release's checksums file.
      TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t algen-agent-runtime:scan .
      - name: Install Trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version
      - name: Scan container image
        run: >-
          "$RUNNER_TEMP/trivy" image --no-progress --ignorefile .trivyignore.yaml --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 algen-agent-runtime:scan
      # The report also lists MEDIUM findings, which do not fail the job: a moderate CVE in the
      # image (pip's, before 0.2.0b5) is still raised as an alert.
      - name: Write SARIF report
        if: always()
        run: >-
          "$RUNNER_TEMP/trivy" image --no-progress --ignorefile .trivyignore.yaml --severity MEDIUM,HIGH,CRITICAL --ignore-unfixed
          --format sarif --output trivy-results.sarif algen-agent-runtime:scan
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/security.yml:container
      - name: Archive Trivy results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
