version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised one is caught upstream first. Security
    # updates are not delayed.
    cooldown:
      default-days: 14
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
  # The hash-locked requirements/*.txt (pip-compile files with their requirements/*.in).
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised one is caught upstream first. Security
    # updates are not delayed.
    cooldown:
      default-days: 14
    groups:
      locked:
        patterns: ["*"]
  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised one is caught upstream first. Security
    # updates are not delayed.
    cooldown:
      default-days: 14
    groups:
      # init and analyze must move together, or the CodeQL job fails on mixed versions.
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release, so a compromised one is caught upstream first. Security
    # updates are not delayed.
    cooldown:
      default-days: 14
